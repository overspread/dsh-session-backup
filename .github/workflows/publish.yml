name: publish

# Stage releases from version tags or start a run manually for the current version.
# The tag names the staged version; the guard below checks package.json.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # npm Trusted Publishing exchanges this short-lived OIDC token for publish
  # rights scoped to this repository. No long-lived npm token is stored.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Trusted Publishing needs the public registry: the OIDC exchange is
          # not available through a mirror.
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing requires npm >=11.15.0; Node 22 bundles npm 10.
      - name: Set up npm for staged publishing
        run: npm install --global npm@11.19.1 --registry=https://registry.npmjs.org

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${declared}" >&2
            exit 1
          fi

      # No install step: the package has no dependencies or devDependencies to
      # lock (its only peer requirement is @deepseek-ai/cordis, supplied by the
      # Host at runtime), and both the build and every test are plain Node with
      # no install tree. Adding `npm ci` would need a lockfile this repo has no
      # reason to hold, and it cannot resolve peer dependencies anyway.
      #
      # client.js is generated from src/client.mjs and ships in the tarball, so
      # build first and fail the release if the committed bundle is stale.
      - name: Build the client bundle
        run: npm run build

      - name: Fail when the committed bundle is out of date
        run: |
          if ! git diff --quiet -- client.js; then
            echo "client.js is stale: run npm run build and commit the result" >&2
            git diff --stat -- client.js >&2
            exit 1
          fi

      - name: Test
        run: npm test

      # A maintainer approves the staged version on npm with 2FA before it goes live.
      - name: Stage the package on npm
        run: npm stage publish --provenance
